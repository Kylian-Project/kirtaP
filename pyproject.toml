[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kirtap"
version = "0.2.1"
description = "Bot Discord kirtaP"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiohttp>=3.13,<4",
    "aiosqlite>=0.21,<1",
    "discord.py>=2.6.4,<3",
    "python-dotenv>=1.1,<2",
    "tzdata>=2025.2",
]

[project.scripts]
kirtap = "kirtap.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kirtap"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["kirtap"]
